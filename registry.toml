schema_version = 1

# Standalone skill source paths are relative to the repository.
[[skills]]
name = "development-environment"
path = "skills/engineering/development-environment"

[[skills]]
name = "openspec-workflow"
path = "skills/engineering/openspec-workflow"
requires = "openspec"

[[skills]]
name = "repository-artifacts"
path = "skills/engineering/repository-artifacts"

[[skills]]
name = "create-readme"
path = "skills/writing/create-readme"

[[skills]]
name = "ste-ko"
path = "skills/writing/ste-ko"
upstream = "https://github.com/beamonic/ste-ko"

[[skills]]
name = "humanize-windows-runtime"
path = "skills/writing/humanize-windows-runtime"

[[skills]]
name = "korean-typography"
path = "skills/design/korean-typography"

[[skills]]
name = "taste-windows-runtime"
path = "skills/design/taste-windows-runtime"

[[skills]]
name = "feature-sliced-design"
path = "dependencies/skills/feature-sliced-design"
upstream = "https://github.com/feature-sliced/skills"

[[skills]]
name = "humanize-korean"
path = "dependencies/skills/humanize-korean"
upstream = "https://github.com/epoko77-ai/im-not-ai"

[[mcp]]
name = "microsoft-learn"
kind = "http"
url = "https://learn.microsoft.com/api/mcp"

[[mcp]]
name = "nuget"
kind = "nuget"
package = "NuGet.Mcp.Server"
version = "1.4.23"
entrypoint = "nuget-mcp-server"

[[plugins]]
name = "context7"
marketplace = "context7-marketplace"
source = "https://github.com/upstash/context7.git"
channel = "git-ref"
ref = "master"
manifest = "plugins/codex/context7/.codex-plugin/plugin.json"
enabled = true

[[plugins]]
name = "taste-skill"
marketplace = "taste-skill"
source = "https://github.com/Leonxlnx/taste-skill.git"
channel = "latest-release"
manifest = ".codex-plugin/plugin.json"
enabled = true

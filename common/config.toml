# Portable user preferences, based on roylabs-desktop (2026-11-12).
# PC paths, OpenCodex endpoints, app-generated MCP state and hook trust stay local.
service_tier = "default"
approval_policy = "on-request"
sandbox_mode = "danger-full-access"
model_verbosity = "high"
model_reasoning_summary = "detailed"
model = "gpt-6.1-sol"
model_reasoning_effort = "max"

[desktop]
followUpQueueMode = "steer"
default-workspace-full-view = true
autoArchiveAfterDays = 1
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "persistent", "max"]
browser-show-full-url = true
git-branch-prefix = ""
worktree-upstream-refresh-mode = "best-effort"
show-context-window-usage = true
composer-predictions-enabled = true
localeOverride = "ko-KR"
keepRemoteControlAwakeWhilePluggedIn = true
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true

[features]
multi_agent = true

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]

[plugins."codex-app-tools@openai-bundled"]
enabled = true
[plugins."browser@openai-bundled"]
enabled = true
[plugins."unified-computer-use@openai-bundled"]
enabled = true
[plugins."chrome@openai-bundled"]
enabled = true
[plugins."visualize@openai-bundled"]
enabled = true
[plugins."computer-use@openai-bundled"]
enabled = true
[plugins."documents@openai-primary-runtime"]
enabled = true
[plugins."pdf@openai-primary-runtime"]
enabled = true
[plugins."spreadsheets@openai-primary-runtime"]
enabled = true
[plugins."presentations@openai-primary-runtime"]
enabled = true
[plugins."template-creator@openai-primary-runtime"]
enabled = true
[[skills.config]]
name = "computer-use"
enabled = false
[[skills.config]]
name = "agent-desktop"
enabled = true
[[skills.config]]
name = "agent-desktop-windows"
enabled = true
